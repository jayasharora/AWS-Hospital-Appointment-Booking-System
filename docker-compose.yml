version: "3.8"

services:
  # MediCare Flask Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare_web_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=medicare-cloud-production-secret-key-2026
      - DATABASE_URL=postgresql://medicare_user:medicare_secure_pass123@db:5432/medicaredb
      - PORT=5000
      - HOST=0.0.0.0
      - AWS_REGION=us-east-1
      - ENABLE_CLOUDWATCH=false
      - CLOUDWATCH_NAMESPACE=MediCare/HospitalApp
      - CLOUDWATCH_LOG_GROUP=/medicare/application-logs
      - AUTO_RECOVERY_ENABLED=true
      - AUTO_RECOVERY_DELAY_SECONDS=12
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Relational Database Service (Amazon RDS Compatible)
  db:
    image: postgres:15-alpine
    container_name: medicare_postgres_db
    restart: always
    environment:
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_secure_pass123
      POSTGRES_DB: medicaredb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare_user -d medicaredb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: medicare_postgres_data
